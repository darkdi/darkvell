# Owner control panel, served at https://darkvell.ru/admin/.
#
# Insert these two blocks into the `server { server_name darkvell.ru; ... }`
# block of /etc/nginx/sites-enabled/darkvell, before its `location / { ... }`.
#
# Access control is enforced server side: /auth/admin/characters requires an
# account session whose character name is listed in AUTH_ADMIN_NAMES (defaults
# to unit,houston). The static bundle itself carries no data.

location = /admin {
  return 308 /admin/;
}

location /admin/ {
  alias /var/www/darkvell-admin/;
  index index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  try_files $uri $uri/ /admin/index.html;
}
