[Service]
# Telegram alerts for real players joining (game-server/src/telegram-notifier.ts).
#
# The bot token is a secret and must never enter git, so it lives only on the
# server in /etc/darkvell/telegram.env (root-owned, chmod 600). The leading "-"
# means the service still starts if that file is absent; with the variables
# unset the notifier is inert and makes no network calls.
#
# The file holds two lines:
#   TELEGRAM_BOT_TOKEN=<token from @BotFather>
#   TELEGRAM_ADMIN_CHAT_ID=<numeric chat id>
EnvironmentFile=-/etc/darkvell/telegram.env
