[Service]
# 2026-08-07: zzz-emergency-lag.conf (2026-06-08) throttled mobile snapshots to
# 180/300ms and was never lifted, while zzzz-bots-77.conf later restored the bot
# count to 77. Mobile clients were therefore seeing the world at roughly 4Hz
# (snapAge measured at 192-248ms on the owner's iPhone), which reads as input lag.
# Server has headroom again: tick exactly on schedule at GAME_TICK_MS=66, node at
# 30% of one core, load average 0.28.
#
# Measured on prod before settling on these numbers: the in-code defaults
# (120/165) push the game-server process to ~57% of the single core, which is too
# little margin for a box that has tipped over before. 140/200 keeps the latency
# win while staying near ~45%. Tick stays exactly 15/s at GAME_TICK_MS=66.
#
# Rollback: delete this drop-in, `systemctl daemon-reload`, restart the service.
Environment=GAME_MOBILE_SNAPSHOT_MS=140
Environment=GAME_MOBILE_LONG_SNAPSHOT_MS=200
